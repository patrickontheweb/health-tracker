name: Preview or apply AWS infrastructure
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or apply a previously reviewed preview
        required: true
        default: preview
        type: choice
        options: [preview, apply]
      change_set:
        description: Exact change-set name from the preview (apply only)
        required: false
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: health-tracker-production
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AWS_REGION: us-east-1
      AWS_STACK_NAME: health-habits
      AWS_ARTIFACT_BUCKET: pcmckenna-health
      INFRA_OPERATION: ${{ inputs.operation }}
      INFRA_CHANGE_SET: ${{ inputs.change_set }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test infrastructure update logic
        run: node --test test/infrastructure.test.mjs test/passkeys-aws.test.mjs
      - name: Regenerate infrastructure template
        run: node aws/build-template.mjs
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: infra-${{ github.run_id }}
          retry-max-attempts: 3
      - name: Preview or apply reviewed infrastructure changes
        run: node scripts/infrastructure-aws.mjs
